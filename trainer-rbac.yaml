apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: trainer-kubeflow-admin
rules:
- apiGroups: ["trainer.kubeflow.org"]
  resources: ["*"]
  verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: trainer-kubeflow-admin-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: trainer-kubeflow-admin
subjects:
- kind: ServiceAccount
  name: pipeline-runner-dspa
  namespace: mprahl-gb-poc
